# Scala Steward treats `scalaVersion` (2.13.x) as a scala-library dependency and proposes
# "upgrading" it to Scala 3, which would drop the 2.13 cross-build. Scala 3 is tracked separately
# via scala3-library, so ignore Scala 3 versions of scala-library.
updates.ignore = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "3." }
]
