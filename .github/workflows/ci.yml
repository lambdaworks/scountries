name: CI

on:
  pull_request:
  push:
    branches: [ 'main' ]

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 27.0.1+0
          check-latest: true
      - name: Cache Scala dependencies
        uses: coursier/cache-action@v9
      - name: Check code formatting
        run: ./sbt check

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: [ "8", "11", "17", "21" ]
        scala: [ "2.12.21", "3.10.0", "3.7.0" ]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 27.0.1+0
          check-latest: true
      - name: Cache Scala dependencies
        uses: coursier/cache-action@v9
      - name: Run tests
        run: ./sbt ++${{ matrix.scala }} test

  publish-local:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 27.0.1+0
          check-latest: true
      - name: Cache scala dependencies
        uses: coursier/cache-action@v9
      - name: Check that building packages works
        run: ./sbt +publishLocal

  ci:
    runs-on: ubuntu-26.04
    needs: [ lint, test, publish-local ]
    steps:
      - name: Aggregate outcomes
        run: echo "build succeeded"
